# Publishes every package in this repository whose version is not on npm yet.
#
# Managed from absolutejs/scripts (publishing/publish.yml); edit it there and
# roll it out with publishing/rollout.ts rather than editing a copy.
#
# There is no npm token. npm trusts this exact repository, workflow file and
# the `npm-publish` environment, which only main can deploy to, and each run
# mints a credential that lasts minutes; npm attaches provenance on its own
# for public repositories. The build job installs dependencies
# but cannot mint one; the publish job can, but never installs anything, so no
# dependency's install script ever runs next to a credential.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
      - '*/package.json'
      - packages/*/package.json
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: plan
        name: Find versions npm does not have
        run: |
          : > plan.tsv
          for manifest in package.json */package.json packages/*/package.json; do
            [ -f "$manifest" ] || continue
            case "$manifest" in node_modules/*) continue ;; esac
            dir=$(dirname "$manifest")
            [ "$(jq -r '.private // false' "$manifest")" = "true" ] && continue
            name=$(jq -r .name "$manifest")
            version=$(jq -r .version "$manifest")
            [ "$name" = "null" ] || [ "$version" = "null" ] && continue
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            tag=latest
            case "$version" in *-*) tag=$(printf '%s' "${version#*-}" | sed 's/[.0-9]*$//') ;; esac
            printf '%s\t%s\t%s\t%s\n' "$dir" "$name" "$version" "${tag:-next}" >> plan.tsv
            echo "will publish $name@$version (tag ${tag:-next})"
          done
          if [ -s plan.tsv ]; then echo pending=true >> "$GITHUB_OUTPUT"; else echo pending=false >> "$GITHUB_OUTPUT"; fi
      - if: steps.plan.outputs.pending == 'true'
        run: bun install --frozen-lockfile
      - if: steps.plan.outputs.pending == 'true'
        name: Build, check and pack
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          : > "$RUNNER_TEMP/out/plan.tsv"
          while IFS="$(printf '\t')" read -r dir name version tag; do
            echo "::group::$name@$version"
            file="$(printf '%s' "$name" | tr -d @ | tr / -)-$version.tgz"
            (
              cd "$dir"
              has() { jq -e --arg s "$1" '.scripts[$s] // empty' package.json >/dev/null; }
              if has build; then bun run build; fi
              if has check:package; then bun run check:package; fi
              # bun rewrites workspace: ranges to real versions; npm pack would not.
              bun pm pack --ignore-scripts --quiet --filename "$RUNNER_TEMP/out/$file"
            )
            printf '%s\t%s\t%s\t%s\n' "$file" "$name" "$version" "$tag" >> "$RUNNER_TEMP/out/plan.tsv"
            echo "::endgroup::"
          done < plan.tsv
      - if: steps.plan.outputs.pending == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/out
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.pending == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: out
      - name: Publish
        working-directory: out
        run: |
          npm --version
          while IFS="$(printf '\t')" read -r file name version tag; do
            echo "::group::$name@$version"
            npm publish --ignore-scripts --access public --tag "$tag" "./$file"
            echo "::endgroup::"
          done < plan.tsv
